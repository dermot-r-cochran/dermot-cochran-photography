# Sample deploy.conf - copy this to a real "deploy.conf" in the repository
# root of the cPanel Git Version Control clone, then edit the values for
# your account. "deploy.conf" itself is untracked (gitignored) since it's
# specific to one clone - this sample file is the only copy tracked in
# git. See .cpanel.yml's header comment and README.md's Deployment section
# for full details on each key.
#
#   cp sample-deploy.conf deploy.conf

# Destination cPanel account: deploys to /home/<CPANEL_USER>/public_html/.
# Default: dermotco
CPANEL_USER=dermotco

# Public domain this clone serves - no scheme, no path, no trailing slash.
# Also exported as SITE_DOMAIN for the Eleventy build, so
# src/_data/site.js's absolute URLs (used by robots.txt/sitemap.xml) match
# this domain.
# Default: dermotcochran.com
DOMAIN=dermotcochran.com

# Address notified after every deploy attempt, success or failure - and,
# since 2026-08-13, after a scripts/cpanel-autopull.sh run that FAILS before
# it ever reaches the deploy (a broken checkout, or a pull that cannot
# fast-forward). Those used to go only to stderr, which cron delivers to the
# account's own system mailbox where nobody reads it.
# Default: admin@<DOMAIN>
ADMIN_EMAIL=admin@example.com

# Optional (since 2026-09-14). Which deploy outcomes ADMIN_EMAIL is mailed
# about. Failures are always mailed; this only decides what a SUCCESSFUL run
# does:
#   always    mail every attempt (the default, and the behaviour before this
#             key existed)
#   warnings  mail a success only when its log carries a warning from the
#             deploy scripts themselves (subject: SUCCESS WITH WARNINGS); a
#             clean success is not mailed. This repo's own cpanel-deploy.sh
#             raises no such warnings today, so here it behaves as "failure"
#             until it does.
#   failure   never mail a success
# Before switching off routine success mail, note what it was quietly doing:
# it was the one regular proof that ADMIN_EMAIL actually delivers (a
# nonexistent admin@ address is accepted by the MTA and silently discarded),
# and after a merge the check that the site shipped is /version.txt, not the
# absence of mail. An unrecognised value is treated as "always".
# Default: always
#NOTIFY_ON=warnings

# Optional. If set, cpanel-autopull.sh mails a "runs were missed" alert when
# it finds the previous run longer ago than this many hours. Leave unset (the
# default) for no gap alerting.
#
# Deliberately not defaulted to a number: the cron interval is configured in
# cPanel -> Cron Jobs, not in this repo, so only you know what a suspicious
# gap looks like. Set it comfortably above your real interval - for a daily
# overnight cron, 36 catches a missed night without crying wolf over a run
# that merely drifted a couple of hours.
#
# It can only report on the next run that actually happens. A cron that stops
# firing entirely cannot report its own absence.
# Default: (unset - no gap alerting)
#AUTOPULL_MAX_GAP_HOURS=36
