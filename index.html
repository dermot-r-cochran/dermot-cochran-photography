<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dermot Cochran Photography</title>
<meta http-equiv="refresh" content="3; url=https://dermotcochran.com/" />
<link rel="canonical" href="https://dermotcochran.com/" />
<style>
  :root {
    --color-bg: #0d0f12;
    --color-text: #eceef0;
    --color-text-muted: #9a9fa8;
    --color-accent: #d8b26a;
    --color-accent-hover: #eccb8c;
    --font-body: Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 18px; }
  body {
    background-color: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    line-height: 1.7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .redirect {
    max-width: 40ch;
  }
  .redirect__logo {
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    margin-bottom: 1.5rem;
  }
  .redirect__logo span {
    color: var(--color-accent);
  }
  .redirect__text {
    color: var(--color-text-muted);
    margin-bottom: 1rem;
  }
  a {
    color: var(--color-accent);
  }
  a:hover, a:focus {
    color: var(--color-accent-hover);
  }
</style>
</head>
<body>
  <div class="redirect">
    <p class="redirect__logo"><span>&#9670;</span> Dermot Cochran Photography</p>
    <p class="redirect__text">
      This GitHub Pages host is used for pull-request previews only.
      The live site is at <a href="https://dermotcochran.com/">dermotcochran.com</a> &mdash;
      redirecting you there now.
    </p>
  </div>
</body>
</html>
