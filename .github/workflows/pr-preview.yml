name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: pr-preview

jobs:
  deploy-preview:
    name: Deploy PR preview to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      - name: Build site
        if: github.event.action != 'closed'
        run: npm run build

      - name: Deploy or clean up preview
        # Pinned to a commit, not the movable v1 tag: this third-party action
        # runs with contents: write. ffa7509 is v1.8.1 (= v1 on 2026-10-27).
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./_site
